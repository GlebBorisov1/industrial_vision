camera:
  id: "cam_01"
  source: "data/spill/oil_spill.mp4"
  reconnect_sec: 2.0

models:
  detector_path: "models/yolov8n_openvino_model/"
  person_confidence: 0.50
  ppe_model_path: "models/ppe_yolo26n_best_openvino_model/"
  ppe_confidence: 0.50
  ppe_skip: 2
  fire_model_path: "models/fire_detection/fire-smoke.pt"
  fire_confidence: 0.30
  smoke_confidence: 0.35

smoke_fire:
  # Минимальная площадь детекции в пикселях^2 — фильтр от мелких ложных срабатываний
  min_area_px: 2000
  # Опциональный фильтр по соотношению сторон (сварка часто узкая и яркая)
  max_aspect_ratio: 5.0

zones:
  restricted_01:
    points:
      - [0.50, 0.10]
      - [0.95, 0.10]
      - [0.95, 0.95]
      - [0.50, 0.95]

ppe:
  min_person_height: 120
  helmet_classes: ["helmet", "head"]
  vest_class: "vest"
  bbox_padding: 0.10

spill:
  enabled: true
  min_area_px: 5000         # ~70×70 px — соответствует пятну ~0,5 м² в средней перспективе
  max_aspect_ratio: 6.0
  confidence: 0.70
  hsv_low: [0, 0, 20]       # низкая насыщенность, тёмная яркость
  hsv_high: [180, 80, 90]

events:
  person_in_zone:
    enabled: true
    confidence: 0.50
    temporal_n: 5
    temporal_m: 8
    cooldown_sec: 10

  ppe_helmet_missing:
     enabled: true
     temporal_n: 5
     temporal_m: 8
     cooldown_sec: 30

  ppe_vest_missing:
     enabled: true
     temporal_n: 5
     temporal_m: 8
     cooldown_sec: 30

  smoke_detected:
    enabled: true
    temporal_n: 3
    temporal_m: 5
    cooldown_sec: 20

  fire_detected:
    enabled: true
    temporal_n: 2
    temporal_m: 3
    cooldown_sec: 15

  spill_detected:
      enabled: true
      temporal_n: 3
      temporal_m: 5
      cooldown_sec: 30
