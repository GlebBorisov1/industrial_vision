services:
  vision-app:
    build: .
    container_name: industrial_vision
    volumes:
      # Прокидываем папки для живой разработки (изменения сразу видны в контейнере)
      - ./src:/app/src
      - ./configs:/app/configs
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./events:/app/events
      - ./tests:/app/tests
      - ./scripts:/app/scripts
    ports:
      - "8000:8000"   # для FastAPI на Этапе 9
